name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular App
        run: ./node_modules/.bin/ng build --configuration production --base-href=/zen-vijver/

      - name: Add SPA fallback for GitHub Pages
        run: cp dist/ponds-website/browser/index.html dist/ponds-website/browser/404.html

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist/ponds-website/browser
          branch: gh-pages
