<section class="page-shell section-block">
  <div class="container">
    <header class="page-header content-glass av-animate-up">
      <h1 class="text-title-big">{{ 'PONDS.TITLE' | translate }}</h1>
      <p class="text-regular-big mb-0">{{ 'PONDS.SUBTITLE' | translate }}</p>
    </header>

    <div class="ponds-grid">
      @for (item of concepts; track item.id; let i = $index) {
        <a
          class="pond-card av-animate-up"
          [routerLink]="['/ponds', item.id]"
          [style.animation-delay.ms]="i * 80"
        >
          <h2 class="text-title-tiny pond-card-title">
            {{ item.titleKey | translate }}
          </h2>
          <img [src]="item.imageUrl" [alt]="item.altKey | translate" loading="lazy" />
        </a>
      }
    </div>
  </div>
</section>
