<header class="site-header">
  <div class="container header-inner">
    <a routerLink="/" class="brand" (click)="closeMenu()" aria-label="ZenVijver home">
      <img
        class="brand-logo"
        src="images/zenvijver-logo.svg"
        width="72"
        height="72"
        alt="ZenVijver"
      />
      <span class="brand-text">
        <span class="text-title-small">ZenVijver</span>
        <span class="text-caption-tiny brand-tagline">{{ 'BRAND.TAGLINE' | translate }}</span>
      </span>
    </a>

    <button
      type="button"
      class="menu-toggle d-lg-none"
      [attr.aria-expanded]="menuOpen()"
      [attr.aria-label]="'NAV.TOGGLE_MENU' | translate"
      (click)="toggleMenu()"
    >
      @if (menuOpen()) {
        <i class="bi bi-x-lg"></i>
      } @else {
        <i class="bi bi-list"></i>
      }
    </button>

    <nav class="main-nav" [class.is-open]="menuOpen()" aria-label="Main">
      <ul class="nav-list">
        @for (item of navItems; track item.path) {
          <li>
            <a
              class="text-nav-small"
              [routerLink]="item.path"
              routerLinkActive="is-active"
              [routerLinkActiveOptions]="{ exact: item.path === '/' }"
              (click)="closeMenu()"
            >
              {{ item.labelKey | translate }}
            </a>
          </li>
        }
      </ul>

      <div class="lang-switcher" [class.is-open]="langOpen()">
        <button
          type="button"
          class="text-regular-small lang-toggle"
          [attr.aria-expanded]="langOpen()"
          (click)="toggleLang()"
        >
          <i class="bi bi-globe2" aria-hidden="true"></i>
          <span>{{ currentOption().nativeLabel }}</span>
          <i class="bi bi-chevron-down chevron" aria-hidden="true"></i>
        </button>

        @if (langOpen()) {
          <ul class="lang-menu" role="listbox">
            @for (lang of languages; track lang.code) {
              <li>
                <button
                  type="button"
                  role="option"
                  [attr.aria-selected]="currentLanguage() === lang.code"
                  [class.is-selected]="currentLanguage() === lang.code"
                  (click)="selectLanguage(lang.code)"
                >
                  {{ lang.nativeLabel }}
                </button>
              </li>
            }
          </ul>
        }
      </div>
    </nav>
  </div>
</header>
